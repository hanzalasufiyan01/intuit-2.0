# Local development PostgreSQL. Development use only.
services:
  postgres:
    image: postgres:16
    container_name: intuit2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intuit_dev
    ports:
      - "5432:5432"
    volumes:
      - intuit2-pgdata:/var/lib/postgresql/data

volumes:
  intuit2-pgdata:
