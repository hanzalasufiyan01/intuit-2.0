# Deployment smoke test (milestone M1): builds both production images and proves the production
# compose stack on a DISPOSABLE runner: fresh bootstrap and migrations, health and smoke checks,
# configuration failures, forwarded-address spoofing, and backup/restore. Throwaway secrets and test
# data only; nothing here touches a real environment. See docs/operations.md.
name: deploy-smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Every container, network, volume and image of this job belongs to this compose project;
      # teardown removes that project only.
      COMPOSE_PROJECT_NAME: intuit2-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: deploy/docker-compose.prod.yml:deploy/docker-compose.smoke.yml
      # SMOKE_DIR (this job's scratch directory) is derived from $RUNNER_TEMP in the first run step:
      # the runner context is not available in job-level env.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Only for deploy/restore-validate.mjs, which resolves the `pg` package from apps/api.
      - run: pnpm install --frozen-lockfile

      - name: Helpers and throwaway secrets
        run: |
          set -euo pipefail
          umask 077
          # A path, not a secret: made available to the later steps.
          SMOKE_DIR="$RUNNER_TEMP/intuit2-smoke"
          echo "SMOKE_DIR=$SMOKE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SMOKE_DIR"
          cat > "$SMOKE_DIR/lib.sh" <<'LIB'
          # Sourced by later steps. Reads values from .env.production; never prints them.
          umask 077
          envval() { grep -m1 "^$1=" .env.production | cut -d= -f2-; }
          dc() { docker compose --env-file .env.production "$@"; }
          psql_owner() { PGPASSWORD="$(envval INTUIT_OWNER_PASSWORD)" psql -h 127.0.0.1 -p 55432 -U intuit_owner -v ON_ERROR_STOP=1 -At "$@"; }
          LIB
          hex() { openssl rand -hex 24; }
          pg_super=$(hex); owner=$(hex); app=$(hex); metrics=$(hex)
          session=$(openssl rand -hex 32)
          mfa=$(openssl rand -base64 32); webhook=$(openssl rand -base64 32)
          for s in "$pg_super" "$owner" "$app" "$metrics" "$session" "$mfa" "$webhook"; do
            echo "::add-mask::$s"
          done
          {
            echo "POSTGRES_PASSWORD=$pg_super"
            echo "INTUIT_DB_NAME=intuit2"
            echo "INTUIT_OWNER_PASSWORD=$owner"
            echo "INTUIT_APP_PASSWORD=$app"
            echo "APP_ENV=production"
            echo "WEB_ORIGIN=http://localhost:8080"
            echo "TRUST_PROXY=true"
            echo "DATABASE_URL=postgres://intuit_app:$app@postgres:5432/intuit2"
            echo "DATABASE_MIGRATION_URL=postgres://intuit_owner:$owner@postgres:5432/intuit2"
            echo "SESSION_SECRET=$session"
            echo "MFA_ENCRYPTION_KEYS=smoke1:$mfa"
            echo "MFA_ENCRYPTION_ACTIVE_KEY_ID=smoke1"
            echo "WEBHOOK_ENCRYPTION_KEYS=smokewh1:$webhook"
            echo "WEBHOOK_ENCRYPTION_ACTIVE_KEY_ID=smokewh1"
            echo "METRICS_TOKEN=$metrics"
            echo "EMAIL_PROVIDER=smtp"
            echo "SMTP_HOST=mailpit"
            echo "SMTP_PORT=1025"
            echo "SMTP_SECURITY=none"
            echo "EMAIL_FROM=no-reply@smoke.example.test"
          } > .env.production
          # The two URLs must carry exactly the bootstrap credentials (checked without printing them).
          node - <<'NODE'
          const fs = require('node:fs');
          const env = Object.fromEntries(
            fs.readFileSync('.env.production', 'utf8').split('\n').filter(Boolean)
              .map((l) => [l.slice(0, l.indexOf('=')), l.slice(l.indexOf('=') + 1)]),
          );
          for (const k of ['POSTGRES_PASSWORD', 'INTUIT_OWNER_PASSWORD', 'INTUIT_APP_PASSWORD']) {
            if (!/^[0-9a-f]{48}$/.test(env[k])) throw new Error(`${k} is not 48 hex characters`);
          }
          const check = (name, user, passwordKey) => {
            const u = new URL(env[name]);
            if (u.username !== user) throw new Error(`${name}: wrong role`);
            if (decodeURIComponent(u.password) !== env[passwordKey]) throw new Error(`${name}: password differs from ${passwordKey}`);
            if (u.password !== encodeURIComponent(env[passwordKey])) throw new Error(`${name}: password is not URL-encoded correctly`);
            if (decodeURIComponent(u.pathname.slice(1)) !== env.INTUIT_DB_NAME) throw new Error(`${name}: database differs`);
            if (u.hostname !== 'postgres') throw new Error(`${name}: host is not the compose service`);
          };
          check('DATABASE_URL', 'intuit_app', 'INTUIT_APP_PASSWORD');
          check('DATABASE_MIGRATION_URL', 'intuit_owner', 'INTUIT_OWNER_PASSWORD');
          console.log('credentials consistent and URL-encoded (values not shown)');
          NODE

      - name: Validate the compose configuration
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          dc --profile tools --profile restore --profile spoof-check config --quiet
          # Production file alone: PostgreSQL is never published. (Only the selected fields are printed.)
          docker compose --env-file .env.production -f deploy/docker-compose.prod.yml config --format json \
            | jq -e '(.services.postgres.ports // []) | length == 0' > /dev/null
          echo "production compose: postgres publishes no port"
          merged=$(dc --profile tools --profile restore --profile spoof-check config --format json)
          echo "$merged" | jq -e '[.services.postgres.ports[] | .host_ip] | all(. == "127.0.0.1")' > /dev/null
          echo "smoke override: postgres published on 127.0.0.1 only"
          echo "$merged" | jq -e '.networks["smtp-sandbox"].internal == true
            and ((.services.mailpit.ports // []) | length == 0)
            and ((.services.mailpit.networks | keys) == ["smtp-sandbox"])' > /dev/null
          echo "smoke override: mailpit is unpublished and only on the internal smtp-sandbox network"

      - name: Build both images
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          dc --profile tools --profile restore --profile spoof-check build
          docker image ls --filter "reference=${COMPOSE_PROJECT_NAME}-*" --format '{{.Repository}} {{.Size}}'

      - name: Fresh start, bootstrap, migrations
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          dc up -d --wait --wait-timeout 120 postgres
          dc --profile tools run --rm migrate
          files=$(ls apps/api/src/database/migrations/*.sql | wc -l)
          applied=$(psql_owner -d intuit2 -c "select count(*) from schema_migrations")
          echo "migrations applied: $applied of $files files"
          [ "$applied" = "$files" ]
          roles=$(psql_owner -d intuit2 -c "select string_agg(format('%s:%s%s%s', rolname, rolsuper::int, rolbypassrls::int, rolcreaterole::int), ',' order by rolname) from pg_roles where rolname in ('intuit_owner','intuit_app')")
          echo "roles (superuser, bypassrls, createrole as 1/0): $roles"
          [ "$roles" = "intuit_app:000,intuit_owner:000" ]

      - name: Start the stack and wait for the health checks
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          dc up -d --wait --wait-timeout 180 api web mailpit
          dc ps --format '{{.Service}} {{.Status}}'

      - name: Smoke test and sample data
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          BASE_URL=http://localhost:8080 sh deploy/smoke.sh
          pw=$(openssl rand -hex 16); echo "::add-mask::$pw"; printf '%s' "$pw" > "$SMOKE_DIR/user-password"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d "{\"email\":\"owner-before@smoke.example.test\",\"password\":\"$pw\",\"displayName\":\"Smoke Owner\",\"organizationName\":\"Smoke Traders\"}" \
            http://localhost:8080/api/v1/auth/register)
          echo "registration through nginx: $code"; [ "$code" = "201" ]

      - name: SMTP path ends in the sandbox, which has no route out
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d '{"email":"owner-before@smoke.example.test"}' http://localhost:8080/api/v1/auth/password-reset/request)
          echo "password reset request: $code"
          # Mailpit's own API, read from the api container (the only other member of its network).
          found=0
          for i in $(seq 1 30); do
            total=$(dc exec -T api node -e "fetch('http://mailpit:8025/api/v1/messages').then(r=>r.json()).then(j=>console.log(j.total??0)).catch(()=>console.log(0))" || echo 0)
            if [ "${total:-0}" -ge 1 ]; then found=1; break; fi
            sleep 2
          done
          [ "$found" = 1 ] || { echo "no message reached the mail catcher"; exit 1; }
          echo "the reset e-mail reached the mail catcher"
          # The sandbox network has no route out; the default network does (control).
          probe='fetch("https://example.com",{signal:AbortSignal.timeout(8000)}).then(()=>process.exit(0)).catch(()=>process.exit(1))'
          docker run --rm --name "${COMPOSE_PROJECT_NAME}-egress-control" \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            --entrypoint node "${COMPOSE_PROJECT_NAME}-api" -e "$probe" \
            || { echo "control failed: no internet from the default network, so the sandbox check proves nothing"; exit 1; }
          if docker run --rm --name "${COMPOSE_PROJECT_NAME}-egress-sandbox" \
            --network "${COMPOSE_PROJECT_NAME}_smtp-sandbox" \
            --entrypoint node "${COMPOSE_PROJECT_NAME}-api" -e "$probe"; then
            echo "the smtp-sandbox network reached the internet: isolation broken"; exit 1
          fi
          echo "the smtp-sandbox network (the mail catcher's only network) has no outbound route"

      - name: Expected configuration failures
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          image="${COMPOSE_PROJECT_NAME}-api"
          base="$SMOKE_DIR/config-base.env"
          grep -v '^POSTGRES_PASSWORD=\|^INTUIT_' .env.production > "$base"
          expect_failure() {
            name=$1 expected=$2 variant=$3
            set +e
            docker run --rm --name "${COMPOSE_PROJECT_NAME}-cfg-$name" --network none \
              --env-file "$variant" "$image" > "$SMOKE_DIR/cfg-$name.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then echo "FAIL $name: the API started"; exit 1; fi
            grep -qF -- "$expected" "$SMOKE_DIR/cfg-$name.log" || { echo "FAIL $name: expected message not found"; exit 1; }
            echo "ok   $name: refused (exit $rc) with: $expected"
            rm -f "$SMOKE_DIR/cfg-$name.log" "$variant"
          }
          grep -v '^WEB_ORIGIN=' "$base" > "$SMOKE_DIR/v1.env"
          expect_failure missing-web-origin 'WEB_ORIGIN' "$SMOKE_DIR/v1.env"
          grep -v '^SESSION_SECRET=' "$base" > "$SMOKE_DIR/v2.env"; echo "SESSION_SECRET=short" >> "$SMOKE_DIR/v2.env"
          expect_failure short-session-secret 'SESSION_SECRET must be at least 32 characters' "$SMOKE_DIR/v2.env"
          grep -v '^EMAIL_PROVIDER=\|^SMTP_' "$base" > "$SMOKE_DIR/v3.env"; echo "EMAIL_PROVIDER=mock" >> "$SMOKE_DIR/v3.env"
          expect_failure mock-email-in-production 'The mock email provider must not be used in production.' "$SMOKE_DIR/v3.env"
          rm -f "$base"

      - name: Forwarded-address spoofing cannot dodge the per-address rate limit
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          # The vulnerable variant differs from the real configuration in exactly one line.
          sed 's|proxy_set_header X-Forwarded-For $remote_addr;|proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;|' \
            deploy/nginx.conf > "$SMOKE_DIR/nginx-vulnerable.conf"
          changed=$(diff deploy/nginx.conf "$SMOKE_DIR/nginx-vulnerable.conf" | grep -c '^>' || true)
          [ "$changed" = 1 ] || { echo "the vulnerable variant must differ in exactly one line"; exit 1; }
          SMOKE_VULNERABLE_NGINX_CONF="$SMOKE_DIR/nginx-vulnerable.conf" dc --profile spoof-check up -d --wait --wait-timeout 60 web-vulnerable
          # 61 requests, each with a different forged X-Forwarded-For, to a public route that charges a
          # per-address limit of 30 a minute before looking at the token. Fixed one-minute windows: 61
          # requests within 50 s span at most two windows, so one window holds at least 31 of them
          # whenever the limit is keyed on the real address. Returns 0 when a 429 was seen.
          limited() {
            base=$1 net=$2 start=$(date +%s) seen=0 first=0 other=0
            for i in $(seq 1 61); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Forwarded-For: $net.$i" \
                "$base/api/v1/public/invoices/smoke-no-such-token-0000000000")
              case "$code" in
                429) seen=$((seen + 1)); [ "$first" = 0 ] && first=$i ;;
                404) ;;
                *) other=$((other + 1)) ;;
              esac
            done
            elapsed=$(( $(date +%s) - start ))
            echo "  $base: 429 x$seen (first at request $first), other statuses x$other, ${elapsed}s"
            [ "$other" = 0 ] || { echo "unexpected statuses"; exit 1; }
            [ "$elapsed" -lt 50 ] || { echo "too slow to be deterministic"; exit 1; }
            if [ "$seen" -gt 0 ]; then
              [ "$first" -ge 31 ] || { echo "limited before the 31st request"; exit 1; }
              return 0
            fi
            return 1
          }
          echo "vulnerable configuration (appends the client's header):"
          if limited http://127.0.0.1:8081 198.51.100; then
            echo "FAIL: the check passed against the vulnerable configuration, so it proves nothing"; exit 1
          fi
          echo "  -> forged addresses dodge the limit, as expected for the vulnerable variant"
          echo "real configuration (deploy/nginx.conf):"
          limited http://localhost:8080 203.0.113 || { echo "FAIL: forged addresses dodge the limit"; exit 1; }
          echo "  -> the limit applies to the real client address"
          dc --profile spoof-check stop web-vulnerable

      - name: Backup, restore into an empty database, validate
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          owner=$(envval INTUIT_OWNER_PASSWORD)
          # A still source: nothing writes while the backup is taken.
          dc stop api web
          mkdir -p "$SMOKE_DIR/files" "$SMOKE_DIR/backups"
          dc cp api:/data/storage/. "$SMOKE_DIR/files/"
          DATABASE_MIGRATION_URL="postgresql://intuit_owner:$owner@127.0.0.1:55432/intuit2" \
            FILES_DIR="$SMOKE_DIR/files" BACKUP_DIR="$SMOKE_DIR/backups" sh deploy/backup.sh
          dump=$(ls "$SMOKE_DIR"/backups/intuit2-*.dump)
          # Restore target: created with the same bootstrap as the original, and checked to be empty.
          dc exec -T -e INTUIT_DB_NAME=intuit2_restore postgres sh /docker-entrypoint-initdb.d/10-intuit-bootstrap.sh > /dev/null
          tables=$(psql_owner -d intuit2_restore -c "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "restore target before restore: $tables tables"; [ "$tables" = 0 ]
          TARGET_URL="postgresql://intuit_owner:$owner@127.0.0.1:55432/intuit2_restore" sh deploy/restore.sh "$dump"
          SOURCE_URL="postgresql://intuit_owner:$owner@127.0.0.1:55432/intuit2" \
            TARGET_URL="postgresql://intuit_owner:$owner@127.0.0.1:55432/intuit2_restore" \
            STRICT_COUNTS=yes node deploy/restore-validate.mjs
          files=$(ls apps/api/src/database/migrations/*.sql | wc -l)
          before=$(psql_owner -d intuit2_restore -c "select count(*) from schema_migrations")
          dc --profile tools run --rm \
            -e DATABASE_MIGRATION_URL="postgres://intuit_owner:$owner@postgres:5432/intuit2_restore" \
            migrate node dist/src/database/cli/migrate.js
          after=$(psql_owner -d intuit2_restore -c "select count(*) from schema_migrations")
          echo "restored migrations: $before before migrate, $after after, $files files"
          [ "$before" = "$files" ] && [ "$after" = "$files" ]
          users=$(psql_owner -d intuit2_restore -c "select count(*) from users where email = 'owner-before@smoke.example.test'")
          echo "restored copy holds the sample owner: $users"; [ "$users" = 1 ]

      - name: The restored API serves the restored database
        run: |
          set -euo pipefail
          . "$SMOKE_DIR/lib.sh"
          owner=$(envval INTUIT_OWNER_PASSWORD); app=$(envval INTUIT_APP_PASSWORD)
          pw=$(cat "$SMOKE_DIR/user-password")
          dc up -d --wait --wait-timeout 180 api web
          # Written to the ORIGINAL database only, after the backup.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d "{\"email\":\"owner-after@smoke.example.test\",\"password\":\"$pw\",\"displayName\":\"Later Owner\",\"organizationName\":\"Later Traders\"}" \
            http://localhost:8080/api/v1/auth/register)
          echo "registration after the backup (original database): $code"; [ "$code" = "201" ]
          RESTORED_DATABASE_URL="postgres://intuit_app:$app@postgres:5432/intuit2_restore" \
            RESTORED_DATABASE_MIGRATION_URL="postgres://intuit_owner:$owner@postgres:5432/intuit2_restore" \
            dc --profile restore up -d --wait --wait-timeout 180 api-restored
          login() {
            curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
              -d "{\"email\":\"$2\",\"password\":\"$pw\"}" "$1/api/v1/auth/login"
          }
          a=$(login http://127.0.0.1:3001 owner-before@smoke.example.test)
          b=$(login http://127.0.0.1:3001 owner-after@smoke.example.test)
          c=$(login http://localhost:8080 owner-after@smoke.example.test)
          echo "restored API: owner-before $a, owner-after $b; original API: owner-after $c"
          [ "$a" = 200 ] && [ "$b" = 401 ] && [ "$c" = 200 ]
          health=$(curl -fsS http://127.0.0.1:3001/api/v1/health)
          echo "$health" | grep -q '"database":"ok"'
          echo "the restored API is healthy and answers from the restored copy"

      - name: Teardown (this job's compose project only)
        if: always()
        run: |
          set -u
          rc=0
          # Same directory as the first run step, even if that step never ran.
          SMOKE_DIR="${SMOKE_DIR:-$RUNNER_TEMP/intuit2-smoke}"
          # Compose needs the env file to parse the project; recreate an empty one if a failed early
          # step never wrote it. Values are irrelevant for removal.
          [ -f .env.production ] || : > .env.production
          for v in POSTGRES_PASSWORD INTUIT_DB_NAME INTUIT_OWNER_PASSWORD INTUIT_APP_PASSWORD; do
            grep -q "^$v=" .env.production || export "$v=unused"
          done
          docker compose --env-file .env.production -p "$COMPOSE_PROJECT_NAME" \
            --profile tools --profile restore --profile spoof-check \
            down --volumes --remove-orphans --rmi local || rc=$?
          for n in cfg-missing-web-origin cfg-short-session-secret cfg-mock-email-in-production egress-control egress-sandbox; do
            docker rm -f "${COMPOSE_PROJECT_NAME}-$n" > /dev/null 2>&1 || true
          done
          rm -f .env.production
          rm -rf -- "$SMOKE_DIR"
          remaining=$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | wc -l)
          echo "containers left in project $COMPOSE_PROJECT_NAME: $remaining"
          [ "$remaining" = 0 ] || rc=1
          exit "$rc"

  # Review database on a NON-default port. The demo-seed wrapper refuses port 5432, so a review
  # environment runs PostgreSQL on another port (INTUIT_DB_PORT). This job proves, on a disposable
  # runner and in its own compose project, that: the default stays 5432; a fresh bootstrap works on
  # 5433 (the PGPORT behaviour of the official image is verified HERE, not assumed); the built API
  # image contains the demo-seed wrapper and its guard; the wrapper still refuses 5432 inside the
  # stack; the seed reaches only `intuit2_review`; and the API serves the seeded database.
  #
  # Secrets: throwaway values only, generated per run and masked. They live in two files with mode
  # 600 (.env.production in the workspace, seed.env in a 700 directory under RUNNER_TEMP), are never
  # printed, never uploaded (this job has no upload step), and are deleted by the teardown on success
  # and on failure. Commands receive secrets through environment variable NAMES, not on a command line.
  #
  # Cleanup: scoped to this job's unique compose project (run id and attempt in its name) by compose
  # itself and then, as a fallback for partial setups, by that project's labels. No image is removed
  # (one image ID can carry several names, and postgres and mailpit may be shared): the runner is
  # disposable and discards its images.
  review-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: intuit2-review-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: deploy/docker-compose.prod.yml:deploy/docker-compose.smoke.yml
    steps:
      - uses: actions/checkout@v4

      - name: Helpers and throwaway secrets (database intuit2_review on port 5433)
        run: |
          set -euo pipefail
          set +x
          umask 077
          REVIEW_DIR="$RUNNER_TEMP/intuit2-review"
          # A path, not a secret: made available to the later steps.
          echo "REVIEW_DIR=$REVIEW_DIR" >> "$GITHUB_ENV"
          mkdir -p "$REVIEW_DIR"
          chmod 700 "$REVIEW_DIR"
          cat > "$REVIEW_DIR/lib.sh" <<'LIB'
          # Sourced by later steps. Reads values from files; never prints them.
          set +x
          umask 077
          envval() { grep -m1 "^$1=" .env.production | cut -d= -f2-; }
          seedval() { grep -m1 "^$1=" "$REVIEW_DIR/seed.env" | cut -d= -f2-; }
          dc() { docker compose --env-file .env.production "$@"; }
          psql_owner() { PGPASSWORD="$(envval INTUIT_OWNER_PASSWORD)" psql -h 127.0.0.1 -p 55432 -U intuit_owner -v ON_ERROR_STOP=1 -At "$@"; }
          # Secrets reach the containers by variable NAME (never on a command line).
          seed() { dc --profile tools run --rm -T --no-deps -e DEMO_SEED_CONFIRM=intuit2_review -e DEV_SEED_PASSWORD -e DEV_SEED_TOTP_SECRET migrate node dist/src/database/cli/seed-demo.js; }
          # After a failure show only lines of known-safe shapes from a captured output.
          safe_lines() { grep -E '^(Target:|Verified |Demo data|Development seed|The demo seed refused|  - )' "$1" || true; }
          # Fails (without printing any value) if the value is empty or occurs in the file.
          scan_for() {
            local name="$1" value="$2" file="$3" rc=0
            [ -n "$value" ] || { echo "FAIL: no value to scan for ($name)"; return 1; }
            [ -f "$file" ] || { echo "FAIL: nothing to scan ($(basename "$file"))"; return 1; }
            grep -qF -e "$value" "$file" 2> /dev/null || rc=$?
            case "$rc" in
              0) echo "LEAK: $name appears in $(basename "$file")"; return 1 ;;
              1) return 0 ;;
              *) echo "FAIL: the scan could not run ($name)"; return 1 ;;
            esac
          }
          LIB
          hex() { openssl rand -hex 24; }
          pg_super=$(hex); owner=$(hex); app=$(hex)
          session=$(openssl rand -hex 32)
          mfa=$(openssl rand -base64 32)
          seedpw="$(openssl rand -hex 16)Aa1!"
          totp=$(openssl rand 32 | base32 | tr -d '=\n' | head -c 32)
          for s in "$pg_super" "$owner" "$app" "$session" "$mfa" "$seedpw" "$totp"; do
            echo "::add-mask::$s"
          done
          {
            echo "POSTGRES_PASSWORD=$pg_super"
            echo "INTUIT_DB_NAME=intuit2_review"
            echo "INTUIT_DB_PORT=5433"
            echo "INTUIT_OWNER_PASSWORD=$owner"
            echo "INTUIT_APP_PASSWORD=$app"
            echo "APP_ENV=production"
            echo "WEB_ORIGIN=http://localhost:8080"
            echo "TRUST_PROXY=true"
            echo "DATABASE_URL=postgres://intuit_app:$app@postgres:5433/intuit2_review"
            echo "DATABASE_MIGRATION_URL=postgres://intuit_owner:$owner@postgres:5433/intuit2_review"
            echo "SESSION_SECRET=$session"
            echo "MFA_ENCRYPTION_KEYS=review1:$mfa"
            echo "MFA_ENCRYPTION_ACTIVE_KEY_ID=review1"
            echo "EMAIL_PROVIDER=smtp"
            echo "SMTP_HOST=mailpit"
            echo "SMTP_PORT=1025"
            echo "SMTP_SECURITY=none"
            echo "EMAIL_FROM=no-reply@review.example.test"
          } > .env.production
          # The demo credentials stay out of .env.production: only the seeding command receives them.
          {
            echo "DEV_SEED_PASSWORD=$seedpw"
            echo "DEV_SEED_TOTP_SECRET=$totp"
          } > "$REVIEW_DIR/seed.env"
          # Restrictive permissions are enforced, not assumed (modes only; nothing else is printed).
          [ "$(stat -c %a "$REVIEW_DIR")" = 700 ] || { echo "FAIL: the secret directory is not mode 700"; exit 1; }
          for f in .env.production "$REVIEW_DIR/seed.env" "$REVIEW_DIR/lib.sh"; do
            [ "$(stat -c %a "$f")" = 600 ] || { echo "FAIL: a secret file is not mode 600"; exit 1; }
          done
          echo "secret files: mode 600 in a mode 700 directory"
          # The URLs must carry exactly the bootstrap credentials, the review database and port 5433
          # (checked without printing any value).
          node - <<'NODE'
          const fs = require('node:fs');
          const env = Object.fromEntries(
            fs.readFileSync('.env.production', 'utf8').split('\n').filter(Boolean)
              .map((l) => [l.slice(0, l.indexOf('=')), l.slice(l.indexOf('=') + 1)]),
          );
          const check = (name, user, passwordKey) => {
            const u = new URL(env[name]);
            if (u.username !== user) throw new Error(`${name}: wrong role`);
            if (decodeURIComponent(u.password) !== env[passwordKey]) throw new Error(`${name}: password differs from ${passwordKey}`);
            if (decodeURIComponent(u.pathname.slice(1)) !== 'intuit2_review') throw new Error(`${name}: database differs`);
            if (u.hostname !== 'postgres') throw new Error(`${name}: host is not the compose service`);
            if (u.port !== '5433' || env.INTUIT_DB_PORT !== '5433') throw new Error(`${name}: port is not 5433`);
          };
          check('DATABASE_URL', 'intuit_app', 'INTUIT_APP_PASSWORD');
          check('DATABASE_MIGRATION_URL', 'intuit_owner', 'INTUIT_OWNER_PASSWORD');
          console.log('credentials, database and port consistent (values not shown)');
          NODE

      - name: Compose configuration (default port unchanged, review port set, PostgreSQL never public)
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          # Every `config` output is discarded or reduced by jq to a yes or no: it would contain secrets.
          dc --profile tools config --quiet
          # Production file alone: PostgreSQL is never published, on any port.
          docker compose --env-file .env.production -f deploy/docker-compose.prod.yml config --format json \
            | jq -e '(.services.postgres.ports // []) | length == 0' > /dev/null
          echo "production compose: postgres publishes no port"
          docker compose --env-file .env.production -f deploy/docker-compose.prod.yml config --format json \
            | jq -e '.services.postgres.environment.PGPORT == "5433" and .services.postgres.command == ["postgres","-p","5433"]' > /dev/null
          echo "review settings: PGPORT and the server command use 5433"
          # Without INTUIT_DB_PORT the port is the unchanged default.
          grep -v '^INTUIT_DB_PORT=' .env.production > "$REVIEW_DIR/default.env"
          docker compose --env-file "$REVIEW_DIR/default.env" -f deploy/docker-compose.prod.yml config --format json \
            | jq -e '.services.postgres.environment.PGPORT == "5432" and .services.postgres.command == ["postgres","-p","5432"]' > /dev/null
          echo "default settings: port 5432, as before"
          # The CI-only override publishes on this runner's loopback only, to the review port.
          dc --profile tools config --format json \
            | jq -e '(.services.postgres.ports | length > 0)
              and ([.services.postgres.ports[] | .host_ip] | all(. == "127.0.0.1"))
              and ([.services.postgres.ports[] | .target] | all(. == 5433))' > /dev/null
          echo "smoke override: loopback only, container port 5433"

      - name: Build the API image
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          dc --profile tools build migrate

      - name: The API image contains the demo-seed wrapper and its guard
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          dc --profile tools run --rm -T --no-deps --entrypoint sh migrate -c \
            'test -f dist/src/database/cli/seed-demo.js && test -f dist/src/database/cli/demo-seed-guard.js && test -f dist/src/database/cli/seed-dev.js'
          echo "image holds seed-demo.js, demo-seed-guard.js and seed-dev.js"
          # The guard loads with only the image's production dependencies (no database involved).
          dc --profile tools run --rm -T --no-deps --entrypoint node migrate --input-type=module -e \
            "const m = await import('/app/dist/src/database/cli/demo-seed-guard.js'); if (m.DEMO_DATABASE !== 'intuit2_review' || !m.PROTECTED_DATABASES.includes('intuit2_dev')) process.exit(1); console.log('guard module loads: ' + m.DEMO_DATABASE)"

      - name: Fresh bootstrap on port 5433 and proof that the database is isolated
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          dc up -d --wait --wait-timeout 120 postgres
          port=$(psql_owner -d intuit2_review -c "show port")
          echo "server port seen by the server itself: $port"; [ "$port" = 5433 ]
          if dc exec -T postgres pg_isready -h 127.0.0.1 -p 5432 > /dev/null 2>&1; then
            echo "FAIL: something answers on 5432 inside the database container"; exit 1
          fi
          echo "nothing listens on 5432 inside the database container"
          names=$(psql_owner -d intuit2_review -c "select string_agg(datname, ',' order by datname) from pg_database")
          echo "databases in this cluster: $names"
          [ "$names" = "intuit2_review,postgres,template0,template1" ]
          roles=$(psql_owner -d intuit2_review -c "select string_agg(format('%s:%s%s%s', rolname, rolsuper::int, rolbypassrls::int, rolcreaterole::int), ',' order by rolname) from pg_roles where rolname like 'intuit_%'")
          echo "roles (superuser, bypassrls, createrole as 1/0): $roles"
          [ "$roles" = "intuit_app:000,intuit_owner:000" ]

      - name: Migrations
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          dc --profile tools run --rm -T migrate
          files=$(ls apps/api/src/database/migrations/*.sql | wc -l)
          applied=$(psql_owner -d intuit2_review -c "select count(*) from schema_migrations")
          echo "migrations applied: $applied of $files files"
          [ "$applied" = "$files" ]

      - name: The wrapper still refuses unsafe settings inside the stack
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          set -a; . "$REVIEW_DIR/seed.env"; set +a
          # 1. Port 5432 in the URLs (the database does not listen there): refused before any
          #    connection. The URLs reach the container by variable name, not on a command line.
          DATABASE_URL="postgres://intuit_app:$(envval INTUIT_APP_PASSWORD)@postgres:5432/intuit2_review"
          DATABASE_MIGRATION_URL="postgres://intuit_owner:$(envval INTUIT_OWNER_PASSWORD)@postgres:5432/intuit2_review"
          export DATABASE_URL DATABASE_MIGRATION_URL
          rc=0
          dc --profile tools run --rm -T --no-deps \
            -e DEMO_SEED_CONFIRM=intuit2_review -e DEV_SEED_PASSWORD -e DEV_SEED_TOTP_SECRET \
            -e DATABASE_URL -e DATABASE_MIGRATION_URL \
            migrate node dist/src/database/cli/seed-demo.js > "$REVIEW_DIR/refuse-1.out" 2>&1 || rc=$?
          unset DATABASE_URL DATABASE_MIGRATION_URL
          safe_lines "$REVIEW_DIR/refuse-1.out" | head -5
          if [ "$rc" -eq 0 ] || ! grep -q "5432" "$REVIEW_DIR/refuse-1.out" || grep -q "Verified" "$REVIEW_DIR/refuse-1.out"; then
            echo "FAIL: port 5432 was not refused before connecting (exit $rc)"; exit 1
          fi
          echo "ok: port 5432 refused before any connection (exit $rc)"
          # 2. A wrong confirmation.
          rc=0
          dc --profile tools run --rm -T --no-deps \
            -e DEMO_SEED_CONFIRM=intuit2_dev -e DEV_SEED_PASSWORD -e DEV_SEED_TOTP_SECRET \
            migrate node dist/src/database/cli/seed-demo.js > "$REVIEW_DIR/refuse-2.out" 2>&1 || rc=$?
          safe_lines "$REVIEW_DIR/refuse-2.out" | head -5
          if [ "$rc" -eq 0 ] || ! grep -q "DEMO_SEED_CONFIRM" "$REVIEW_DIR/refuse-2.out" || grep -q "Verified" "$REVIEW_DIR/refuse-2.out"; then
            echo "FAIL: a wrong confirmation was not refused before connecting (exit $rc)"; exit 1
          fi
          echo "ok: wrong confirmation refused before any connection (exit $rc)"

      - name: Seed the review database, twice
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          set -a; . "$REVIEW_DIR/seed.env"; set +a
          counts() { psql_owner -d intuit2_review -c "select (select count(*) from organizations) || ',' || (select count(*) from users) || ',' || (select count(*) from accounting_journal_entries) || ',' || (select count(*) from sales_invoices) || ',' || (select count(*) from purchases_bills)"; }
          seed > "$REVIEW_DIR/seed-1.out" 2>&1 || { safe_lines "$REVIEW_DIR/seed-1.out"; echo "FAIL: the first seed run failed"; exit 1; }
          grep -q "Verified runtime connection: database intuit2_review on port 5433 as intuit_app" "$REVIEW_DIR/seed-1.out"
          grep -q "Verified migration connection: database intuit2_review on port 5433 as intuit_owner" "$REVIEW_DIR/seed-1.out"
          first=$(counts)
          echo "organizations, users, journal entries, invoices, bills after the first run: $first"
          [ "$(echo "$first" | cut -d, -f1,2)" = "1,3" ]
          seed > "$REVIEW_DIR/seed-2.out" 2>&1 || { safe_lines "$REVIEW_DIR/seed-2.out"; echo "FAIL: the second seed run failed"; exit 1; }
          grep -q "nothing changed" "$REVIEW_DIR/seed-2.out"
          second=$(counts)
          echo "after the second run: $second"
          [ "$first" = "$second" ]

      - name: The API serves the seeded database on port 5433
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          dc up -d --wait --wait-timeout 180 api mailpit
          dc exec -T api node -e "fetch('http://127.0.0.1:3000/api/v1/health').then(async (r) => { const b = await r.json(); console.log('health', r.status, JSON.stringify(b)); process.exit(r.ok && b.data.database === 'ok' ? 0 : 1); })"
          # The password reaches the container by variable name; only a status code is printed.
          SEEDPW="$(seedval DEV_SEED_PASSWORD)"
          export SEEDPW
          code=$(dc exec -T -e SEEDPW api node -e "fetch('http://127.0.0.1:3000/api/v1/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: 'member@intuit2-dev.test', password: process.env.SEEDPW }) }).then((r) => console.log(r.status))")
          unset SEEDPW
          echo "sign-in as the seeded member through the API: $code"; [ "$code" = 200 ]

      - name: No secret appears in the captured outputs
        run: |
          set -euo pipefail
          . "$REVIEW_DIR/lib.sh"
          # Failures name the secret, never its value. An empty value, a missing file or a scan that
          # cannot run is a failure, not a pass.
          for f in "$REVIEW_DIR"/seed-1.out "$REVIEW_DIR"/seed-2.out "$REVIEW_DIR"/refuse-1.out "$REVIEW_DIR"/refuse-2.out; do
            for k in POSTGRES_PASSWORD INTUIT_OWNER_PASSWORD INTUIT_APP_PASSWORD SESSION_SECRET MFA_ENCRYPTION_KEYS; do
              scan_for "$k" "$(envval "$k")" "$f"
            done
            for k in DEV_SEED_PASSWORD DEV_SEED_TOTP_SECRET; do
              scan_for "$k" "$(seedval "$k")" "$f"
            done
            rc=0
            grep -qiE 'postgres(ql)?://' "$f" 2> /dev/null || rc=$?
            case "$rc" in
              1) ;;
              0) echo "LEAK: a connection string appears in $(basename "$f")"; exit 1 ;;
              *) echo "FAIL: the connection-string scan could not run"; exit 1 ;;
            esac
          done
          echo "no generated secret and no connection string in the captured outputs"

      - name: Teardown (this job's compose project only; also after a failure)
        if: always()
        run: |
          set -u
          set +x
          rc=0
          REVIEW_DIR="${REVIEW_DIR:-$RUNNER_TEMP/intuit2-review}"
          # Safety: act only on a project name of exactly this job's shape. An empty or different
          # name would make the label filters below match other jobs' resources.
          case "$COMPOSE_PROJECT_NAME" in
            intuit2-review-[0-9]*-[0-9]*) ;;
            *) echo "refusing to clean up: unexpected project name"; exit 1 ;;
          esac
          label="label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"
          # 1. Through compose, which knows the project's containers, networks and volumes. If an
          #    early step never wrote the env file (partial setup), an empty one and placeholder
          #    values let compose parse the project; the values are irrelevant for removal. Images
          #    are NOT removed here, so nothing another job may share is touched.
          [ -f .env.production ] || : > .env.production
          for v in POSTGRES_PASSWORD INTUIT_DB_NAME INTUIT_OWNER_PASSWORD INTUIT_APP_PASSWORD; do
            grep -q "^$v=" .env.production || export "$v=unused"
          done
          docker compose --env-file .env.production -p "$COMPOSE_PROJECT_NAME" --profile tools \
            down --volumes --remove-orphans || rc=$?
          # 2. Fallback by label, in case compose could not parse the project: only objects that carry
          #    THIS project's label: containers, then networks and volumes. Images are left in place:
          #    an image ID can be tagged in several repositories (the built images share layers and may
          #    share an ID), so removing by ID could refuse or take a shared tag with it.
          docker ps -aq --filter "$label" | xargs -r docker rm -f > /dev/null || rc=$?
          docker network ls -q --filter "$label" | xargs -r docker network rm > /dev/null || rc=$?
          docker volume ls -q --filter "$label" | xargs -r docker volume rm > /dev/null || rc=$?
          # 3. The secret files, on success and on failure alike.
          rm -f .env.production
          rm -rf -- "$REVIEW_DIR"
          if [ -e .env.production ] || [ -e "$REVIEW_DIR" ]; then echo "FAIL: a secret file was not removed"; rc=1; fi
          # 4. Nothing of this project may remain.
          left_c=$(docker ps -aq --filter "$label" | wc -l)
          left_n=$(docker network ls -q --filter "$label" | wc -l)
          left_v=$(docker volume ls -q --filter "$label" | wc -l)
          echo "left in project $COMPOSE_PROJECT_NAME: containers $left_c, networks $left_n, volumes $left_v"
          [ "$left_c" = 0 ] && [ "$left_n" = 0 ] && [ "$left_v" = 0 ] || rc=1
          exit "$rc"
