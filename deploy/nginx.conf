# Serves the web app and proxies /api to the API container. Terminate TLS in front of this (a load
# balancer or a TLS-terminating proxy) and set TRUST_PROXY=true and WEB_ORIGIN=https://<host> on
# the API. Cookies are Secure in production, so the site must be served over HTTPS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 30m;   # file uploads are limited to 25 MB by the API

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
