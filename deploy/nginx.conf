# Serves the web app and proxies /api to the API container. Terminate TLS in front of this (a load
# balancer or a TLS-terminating proxy) and set TRUST_PROXY=true and WEB_ORIGIN=https://<host> on
# the API. Cookies are Secure in production, so the site must be served over HTTPS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 30m;   # file uploads are limited to 25 MB by the API

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Overwrite, never append: with TRUST_PROXY=true the API takes the first address of this
    # header as the client, so an appended client-supplied header would let a caller choose its own
    # rate-limit key. This assumes nginx receives connections directly from clients (or from a
    # TLS terminator that preserves the client address). Behind a load balancer, configure
    # set_real_ip_from <load balancer CIDR> and real_ip_header X-Forwarded-For so that
    # $remote_addr is the real client, and keep this line.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
