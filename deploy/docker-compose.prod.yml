# A single-host production layout: PostgreSQL 16, the API and the web server. Secrets come from
# the environment (an .env.production file that is NOT committed); nothing secret is written here.
# NOT verified in the development environment (no container runtime there). See docs/operations.md.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f deploy/docker-compose.prod.yml run --rm migrate
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # The port defaults to 5432, so nothing changes unless INTUIT_DB_PORT is set. A review
    # environment sets it (for example 5433) because the demo seed refuses port 5432; then
    # INTUIT_DB_PORT, the server command and PGPORT below, and the port in DATABASE_URL and
    # DATABASE_MIGRATION_URL must all agree. PGPORT also makes the image's first-start init server,
    # psql and pg_isready use the same port (checked by the review-port job of deploy-smoke).
    command: ['postgres', '-p', '${INTUIT_DB_PORT:-5432}']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGPORT: ${INTUIT_DB_PORT:-5432}
      # First start on an empty volume: postgres-init/10-intuit-bootstrap.sh creates the roles and
      # the database with these values. They must match DATABASE_URL and DATABASE_MIGRATION_URL.
      INTUIT_DB_NAME: ${INTUIT_DB_NAME:?set INTUIT_DB_NAME}
      INTUIT_OWNER_PASSWORD: ${INTUIT_OWNER_PASSWORD:?set INTUIT_OWNER_PASSWORD}
      INTUIT_APP_PASSWORD: ${INTUIT_APP_PASSWORD:?set INTUIT_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ../apps/api/src/database/bootstrap.sql:/intuit-bootstrap/bootstrap.sql:ro
    # Never published: only the api and migrate containers reach it on the compose network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    env_file: ../.env.production
    environment:
      APP_ENV: production
    volumes:
      - files:/data/storage
    expose: ['3000']

  migrate:
    build: { context: .., target: api }
    profiles: ['tools']
    depends_on: { postgres: { condition: service_healthy } }
    env_file: ../.env.production
    # Migrate, then seed reference data (idempotent).
    command:
      ['sh', '-c', 'node dist/src/database/cli/migrate.js && node dist/src/database/cli/seed.js']

  web:
    build: { context: .., target: web }
    restart: unless-stopped
    depends_on: [api]
    ports: ['8080:80']

volumes:
  pgdata:
  files:
